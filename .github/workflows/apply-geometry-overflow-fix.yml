name: Apply geometry overflow pagination fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-geometry-overflow-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/geometry-overflow-pagination
          persist-credentials: true
      - name: Check out maintainable engine fix
        uses: actions/checkout@v4
        with:
          repository: hatemkhaleefah3-ui/janjooo
          ref: 25b25d864f4951f848950f42d57bdb07d49f49d8
          path: engine-source
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: engine-source/pnpm-lock.yaml
      - name: Verify maintainable engine source
        working-directory: engine-source
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir artifacts/jang-pptx typecheck
          pnpm --dir artifacts/jang-pptx test
      - name: Build standalone browser engine
        working-directory: engine-source/artifacts/jang-pptx
        run: |
          cat > vite.standalone.config.ts <<'CONFIG'
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { defineConfig } from 'vite';
          const root = path.dirname(fileURLToPath(import.meta.url));
          export default defineConfig({
            publicDir: false,
            build: {
              lib: { entry: path.resolve(root, 'src/index.ts'), formats: ['es'], fileName: () => 'pptx-engine.js' },
              outDir: path.resolve(root, 'standalone-dist'),
              emptyOutDir: true,
              sourcemap: false,
              minify: 'esbuild',
            },
          });
          CONFIG
          pnpm exec vite build --config vite.standalone.config.ts
      - name: Install engine and geometry regression in Jang
        run: |
          cp engine-source/artifacts/jang-pptx/standalone-dist/pptx-engine.js ./pptx-engine.js
          shim_path=$(find engine-source/artifacts/jang-pptx/standalone-dist -maxdepth 1 -name '__vite-browser-external-*.js' -print -quit)
          test -n "$shim_path"
          shim_name=$(basename "$shim_path")
          cp "$shim_path" ./__vite-browser-external.js
          node - "$shim_name" <<'NODE'
          const fs = require('node:fs');
          const shim = process.argv[2];
          const path = 'pptx-engine.js';
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes(shim)) throw new Error(`Generated engine does not import ${shim}`);
          fs.writeFileSync(path, source.replaceAll(shim, '__vite-browser-external.js'));
          NODE
          node <<'NODE'
          const fs = require('node:fs');
          const buildPath = 'scripts/build.mjs';
          const buildSource = fs.readFileSync(buildPath, 'utf8');
          const oldVersion = '20260726-layout-quality';
          const newVersion = '20260726-geometry-overflow';
          if (!buildSource.includes(oldVersion)) throw new Error('Previous asset version was not found in build script.');
          fs.writeFileSync(buildPath, buildSource.replaceAll(oldVersion, newVersion));

          const scanPath = 'tests/unit/csp-scan.test.mjs';
          const scanSource = fs.readFileSync(scanPath, 'utf8');
          if (!scanSource.includes(oldVersion)) throw new Error('Previous asset version was not found in CSP test.');
          fs.writeFileSync(scanPath, scanSource.replaceAll(oldVersion, newVersion));

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.scripts.unit = packageJson.scripts.unit.replace(
            'tests/unit/csp-scan.test.mjs',
            'tests/unit/geometry-overflow.test.mjs tests/unit/csp-scan.test.mjs',
          );
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          cat > tests/unit/geometry-overflow.test.mjs <<'TEST'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { generateLecturePptx } from "../../pptx-engine.js";

          function geometryRegressionLecture() {
            const mediumParagraph = "alpha beta ".repeat(40);
            return {
              schemaVersion: "1.1",
              documentTitle: "Geometry regression",
              direction: "ltr",
              overview: {
                title: "Overview",
                introduction: "Regression coverage for title reserves and late inline images.",
                keyPoints: ["First-page reserve", "Mixed-column reflow"],
              },
              sections: [{
                sectionId: "geometry",
                sectionTitle: "Geometry",
                slides: [
                  {
                    slideId: "title-reserve",
                    slideTitle: "Title and subtitle reserve",
                    slideSubtitle: "Both blocks must remain above the footer.",
                    sourceReferences: ["p1"],
                    blocks: [
                      { blockId: "p1", type: "paragraph", text: mediumParagraph, sourceReferences: ["p1"] },
                      { blockId: "p2", type: "paragraph", text: mediumParagraph, sourceReferences: ["p1"] },
                    ],
                  },
                  {
                    slideId: "late-image",
                    slideTitle: "Late inline image",
                    slideSubtitle: "The image narrows text after the paragraph has been encountered.",
                    sourceReferences: ["p2"],
                    blocks: [
                      {
                        blockId: "late-image-text",
                        type: "paragraph",
                        text: "alpha beta ".repeat(50),
                        sourceReferences: ["p2"],
                      },
                      {
                        blockId: "late-image-block",
                        type: "image",
                        slotId: "unfilled-late-image",
                        label: "Late image placeholder",
                        description: "This image block appears after the related paragraph.",
                        important: true,
                        sourceReference: "p2",
                        fit: "contain",
                        preferredAspect: "wide",
                        sourceReferences: ["p2"],
                      },
                    ],
                  },
                ],
              }],
              endNote: "Questions",
            };
          }

          test("production engine prevents first-page and late-image geometry overflow", async () => {
            const result = await generateLecturePptx(
              geometryRegressionLecture(),
              {},
              { strictGeometry: true },
            );
            assert.ok(result.blob.size > 1000);
            assert.equal(result.warnings.some((warning) => warning.startsWith("Geometry:")), false);
          });
          TEST
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify application, CSP, and production bundle
        run: |
          npm ci
          npm test
          npm run sample
      - uses: actions/upload-artifact@v4
        with:
          name: geometry-overflow-fixed-production
          path: |
            dist/**
            generated/*.pptx
          if-no-files-found: error
      - name: Commit verified integration
        run: |
          rm -rf engine-source
          rm -f .github/workflows/apply-geometry-overflow-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: prevent content slide geometry overflow"
          git push origin HEAD:fix/geometry-overflow-pagination
