name: Apply final pathway picker and title polish

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-polish.yml'
      - 'scripts/apply-final-polish-v2.mjs'

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/immutable-slide-render-plan
          persist-credentials: true

      - name: Check out measured-title engine source
        uses: actions/checkout@v4
        with:
          repository: hatemkhaleefah3-ui/janjooo
          ref: ae6f89fc98890aeb2cc84507573f433575c0f6ea
          path: engine-source

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: engine-source/pnpm-lock.yaml

      - name: Verify maintainable engine source
        working-directory: engine-source
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir artifacts/jang-pptx typecheck
          pnpm --dir artifacts/jang-pptx test

      - name: Build standalone browser engine
        working-directory: engine-source/artifacts/jang-pptx
        run: |
          cat > vite.standalone.config.ts <<'CONFIG'
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { defineConfig } from 'vite';
          const root = path.dirname(fileURLToPath(import.meta.url));
          export default defineConfig({
            publicDir: false,
            build: {
              lib: { entry: path.resolve(root, 'src/index.ts'), formats: ['es'], fileName: () => 'pptx-engine.js' },
              outDir: path.resolve(root, 'standalone-dist'),
              emptyOutDir: true,
              sourcemap: false,
              minify: 'esbuild',
            },
          });
          CONFIG
          pnpm exec vite build --config vite.standalone.config.ts

      - name: Install engine and targeted refinements
        run: |
          cp engine-source/artifacts/jang-pptx/standalone-dist/pptx-engine.js ./pptx-engine.js
          shim_path=$(find engine-source/artifacts/jang-pptx/standalone-dist -maxdepth 1 -name '__vite-browser-external-*.js' -print -quit)
          test -n "$shim_path"
          shim_name=$(basename "$shim_path")
          cp "$shim_path" ./__vite-browser-external.js
          node - "$shim_name" <<'NODE'
          const fs = require('node:fs');
          const shim = process.argv[2];
          const path = 'pptx-engine.js';
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes(shim)) throw new Error(`Generated engine does not import ${shim}`);
          fs.writeFileSync(path, source.replaceAll(shim, '__vite-browser-external.js'));
          NODE
          node scripts/apply-final-polish-v2.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Run application syntax unit and CSP tests
        run: npm test

      - name: Generate standard application sample
        run: npm run sample

      - name: Generate realistic long-title decks
        run: node scripts/generate-render-plan-regression.mjs

      - name: Render long-title regression through LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
          mkdir -p generated/polish-render
          for deck in generated/amino-acids-render-plan-*.pptx; do
            libreoffice --headless --convert-to pdf --outdir generated/polish-render "$deck"
          done
          for pdf in generated/polish-render/*.pdf; do
            base=$(basename "$pdf" .pdf)
            mkdir -p "generated/polish-render/$base"
            pdftoppm -png -r 90 "$pdf" "generated/polish-render/$base/slide"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: pathway-picker-title-polish-review
          path: |
            generated/amino-acids-render-plan-*.pptx
            generated/amino-acids-render-plan-report.json
            generated/polish-render/**
            dist/**
          if-no-files-found: error

      - name: Commit verified refinements
        run: |
          rm -rf engine-source
          rm -f .github/workflows/apply-final-polish.yml scripts/apply-final-polish.mjs scripts/apply-final-polish-v2.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: improve pathways picker responsiveness and title spacing"
          git push origin HEAD:architecture/immutable-slide-render-plan
