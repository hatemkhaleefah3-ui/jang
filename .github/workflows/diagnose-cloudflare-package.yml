name: Diagnose Cloudflare Pages package

on:
  push:
    branches: [agent/claude-output-import]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/claude-output-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and inspect deployment package
        shell: bash
        run: |
          set +e
          mkdir -p generated/cloudflare-diagnostic
          report=generated/cloudflare-diagnostic/report.txt
          : > "$report"
          echo "commit=$GITHUB_SHA" >> "$report"
          echo "node=$(node --version)" >> "$report"
          echo "npm=$(npm --version)" >> "$report"

          npm ci >> "$report" 2>&1
          echo "npm_ci=$?" >> "$report"
          npm run build >> "$report" 2>&1
          build_code=$?
          echo "npm_run_build=$build_code" >> "$report"

          if [ "$build_code" -eq 0 ]; then
            echo "--- dist files by bytes ---" >> "$report"
            find dist -type f -printf '%s %p\n' | sort -nr >> "$report"
            echo "--- totals ---" >> "$report"
            du -sb dist >> "$report"
            echo "dist_file_count=$(find dist -type f | wc -l)" >> "$report"
            echo "largest_file_bytes=$(find dist -type f -printf '%s\n' | sort -nr | head -1)" >> "$report"
          fi

          npx --yes wrangler@latest pages functions build --outdir generated/cloudflare-diagnostic/functions-build >> "$report" 2>&1
          echo "wrangler_functions_build=$?" >> "$report"
          if [ -d generated/cloudflare-diagnostic/functions-build ]; then
            echo "--- functions bundle files by bytes ---" >> "$report"
            find generated/cloudflare-diagnostic/functions-build -type f -printf '%s %p\n' | sort -nr >> "$report"
            du -sb generated/cloudflare-diagnostic/functions-build >> "$report"
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/diagnose-cloudflare-package.yml
          git add -A
          git add -f "$report"
          git commit -m "Record Cloudflare deployment package diagnostics"
          git push origin HEAD:agent/claude-output-import
