# Production verification for the editable lecture-to-PPTX workflow.
name: Lecture PPTX builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jang-csp-scan
          path: generated/csp-scan.json
          if-no-files-found: error
      - run: npm run sample
      - uses: actions/upload-artifact@v4
        with:
          name: jang-pptx-workflow-sample
          path: generated/jang-website-pptx-workflow-sample.pptx
          if-no-files-found: error
