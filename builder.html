<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jang HTML Lecture Builder</title><link rel="stylesheet" href="/builder.css"><script type="module" src="/builder-app.js"></script></head><body><header><a href="/">Jang</a><strong>HTML Lecture Builder</strong></header><main><section class="input-panel"><h1>Paste or import lecture text</h1><p>Imported UTF-8 text files use the exact same parser and transformation as pasted text.</p><div class="actions"><label class="file-button">Import .txt<input id="textFile" type="file" accept=".txt,text/plain"></label><button id="clearText" type="button">Clear</button></div><textarea id="lectureText" spellcheck="false" placeholder="Paste structured lecture text here…"></textarea><div class="metadata"><label>Course code<input id="courseCode"></label><label>Lecture label<input id="lectureLabel"></label><label>Instructor<input id="instructor"></label></div><button id="buildHtml" class="primary" type="button">Build editable HTML</button><p id="status" role="status"></p></section><section class="preview-panel"><div class="preview-bar"><strong id="previewTitle">Preview</strong><button id="openWindow" type="button" disabled>Open editor</button><button id="downloadHtml" type="button" disabled>Download HTML</button></div><iframe id="preview" sandbox="allow-scripts allow-downloads"></iframe></section></main></body></html>
