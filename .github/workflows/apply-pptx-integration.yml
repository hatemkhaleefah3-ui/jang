name: Apply PPTX integration

on:
  push:
    branches: [integrate-pptx-workflow]
    paths:
      - '.integration/TRIGGER'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed website changes
        run: |
          cat .integration/part-* | base64 --decode > /tmp/jang-remaining.patch
          git apply --whitespace=nowarn /tmp/jang-remaining.patch
          rm -f lecture-html.js tests/unit/lecture-html.test.mjs

      - name: Build approved browser PPTX engine
        run: |
          git clone --depth 1 --branch integrate-approved-pptx-design https://github.com/hatemkhaleefah3-ui/janjooo.git /tmp/janjooo
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          cd /tmp/janjooo
          pnpm install --frozen-lockfile
          cd artifacts/jang-pptx
          cat > vite.standalone.config.ts <<'EOF'
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { defineConfig } from 'vite';
          const root = path.dirname(fileURLToPath(import.meta.url));
          export default defineConfig({
            publicDir: false,
            build: {
              lib: { entry: path.resolve(root, 'src/index.ts'), formats: ['es'], fileName: () => 'pptx-engine.js' },
              outDir: path.resolve(root, 'standalone-dist'),
              emptyOutDir: true,
              sourcemap: false,
              minify: 'esbuild',
            },
          });
          EOF
          pnpm exec vite build --config vite.standalone.config.ts
          cd "$GITHUB_WORKSPACE"
          cp /tmp/janjooo/artifacts/jang-pptx/standalone-dist/pptx-engine.js ./pptx-engine.js
          shim_path=$(find /tmp/janjooo/artifacts/jang-pptx/standalone-dist -maxdepth 1 -name '__vite-browser-external-*.js' -print -quit)
          shim_name=$(basename "$shim_path")
          cp "$shim_path" ./__vite-browser-external.js
          python - "$shim_name" <<'PY'
          from pathlib import Path
          import sys
          path = Path('pptx-engine.js')
          path.write_text(path.read_text().replace(sys.argv[1], '__vite-browser-external.js'))
          PY
          cp /tmp/janjooo/artifacts/jang-pptx/src/schema/lecture-schema.json ./lecture-schema.json

      - name: Verify integrated workflow
        run: |
          npm ci
          npm test
          npm run sample

      - name: Commit verified integration and remove transfer files
        run: |
          rm -rf .integration .snapshot
          rm -f .github/workflows/source-snapshot.yml .github/workflows/apply-pptx-integration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: integrate structured editable PPTX workflow"
          git push origin HEAD:integrate-pptx-workflow
