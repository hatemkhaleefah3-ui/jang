<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Paste lecture text or import a text file, then build and download a responsive one-page HTML slide lecture.">
  <meta name="theme-color" content="#11120f">
  <title>Jang — Build lecture HTML</title>
  <link rel="stylesheet" href="/builder.css">
  <script type="module" src="/builder-app.js"></script>
</head>
<body>
  <main class="app-shell">
    <section class="builder" aria-labelledby="page-title">
      <header class="intro">
        <a class="brand" href="/" aria-label="Jang home"><span>J</span> Jang</a>
        <p class="eyebrow">Lecture HTML builder</p>
        <h1 id="page-title">Paste. Build. Download.</h1>
        <p class="lede">Turn lecture content into one responsive HTML file made of continuous 16:9 slides. Nothing to preview, edit, or convert.</p>
      </header>

      <section class="input-card" aria-label="Lecture source">
        <label for="lectureText">Lecture content</label>
        <textarea id="lectureText" spellcheck="false" placeholder="Paste the complete lecture here…"></textarea>

        <div class="input-footer">
          <span id="textStats" aria-live="polite">0 characters</span>
          <label class="import-button" for="textFile">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0 4 4m-4-4L8 8M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
            Import text file
          </label>
          <input id="textFile" class="visually-hidden" type="file" accept=".txt,.ptx,text/plain">
        </div>
        <p id="fileMeta" class="file-meta" aria-live="polite"></p>
      </section>

      <button id="actionButton" class="action-button" type="button" disabled>
        <span id="actionLabel">Build HTML</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
      </button>
      <p id="status" class="status" role="status" aria-live="polite">Paste lecture content or import a text file to begin.</p>
    </section>
  </main>
</body>
</html>
