name: Source snapshot

on:
  push:
    branches: [integrate-pptx-workflow]
    paths:
      - '.snapshot/**'
      - '.github/workflows/source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository source
        run: |
          tar --exclude='.git' --exclude='.snapshot' -czf /tmp/jang-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: jang-source-snapshot
          path: /tmp/jang-source.tar.gz
          if-no-files-found: error
